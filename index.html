  <body>
    <nav>
      <h1>Nepal Income Tax</h1>
    </nav>
    <div class="subheading">
      <h2>Income Tax Calculator - FY 2082/2083</h2>
    </div>
    <div class="main-form">
      <form id="tax-form">
        <div id="form">
          <div class="income">
            <div class="input-group hr">
              <label for="Status">Nature of Employee</label>
              <select id="status" required>
                <option value="m">Married</option>
                <option value="u">Unmarried</option>
              </select>
            </div>

            <h1>Annual Income</h1>

            <div class="input-group">
              <label for="No of Months">No of Months</label>
              <input type="number" id="months" />
            </div>
            <div class="input-group">
              <label for="Monthly Salary">Monthly Salary</label>
              <input type="number" id="salary" />
            </div>
            <div class="input-group">
              <label for="Bonus">Bonus</label>
              <input type="number" id="bonus" />
            </div>
            <div class="input-group hr">
              <label for="others">Other Allowances</label>
              <input type="number" id="others" />
            </div>

            <div class="input-group">
              <label for="Total Income">Total Income</label>
              <input type="number" id="totalIncome" />
            </div>
          </div>
          <div class="deductions">
            <h1>Annual Deductions</h1>

            <div class="input-group">
              <label for="Provident Fund">Provident Fund</label>
              <input type="number" id="epf" />
            </div>
            <div class="input-group">
              <label for="Citizen Investment">Citizen Investment</label>

              <input type="number" id="cit" />
            </div>
            <div class="input-group hr">
              <label for="Insurance">Insurance</label>
              <input type="number" id="insurance" />
            </div>
            <div class="input-group">
              <label for="Total Deductions">Total Deductions</label>
              <input type="number" id="totalDeductions" />
            </div>
          </div>
        </div>
        <div class="button-group">
          <div class="reset">
            <button type="reset">Reset Values</button>
          </div>
          <div class="calculate">
            <button type="submit">Calculate Tax</button>
          </div>
        </div>
      </form>
    </div>
    <div class="overlay">
      <div class="popup">
        <h2>Tax Summary</h2>

        <div class="input-group">
          <label>Annual Income</label>
          <input type="number" id="ai" value="0" readonly />
        </div>

        <div class="input-group">
          <label>Annual Deduction</label>
          <input type="number" id="ad" value="0" readonly />
        </div>

        <div class="input-group">
          <label>Yearly Tax</label>
          <input type="number" id="yt" value="0" readonly />
        </div>

        <div class="input-group">
          <label>Monthly Tax</label>
          <input type="number" id="mt" value="0" readonly />
        </div>

        <a id="close-btn" class="close-btn">X</a>
      </div>
    </div>
    <footer>
      <p>
        &copy; <span id="year"></span> Prasoon Kandel | All rights reserved.
      </p>
    </footer>
